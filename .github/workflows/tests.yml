name: Python Tests Matrix
permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deterministic-build-compile-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install poetry==2.5.1

      - name: Rebuild deterministic build requirements
        run: bash tools/deterministic-build/compile.sh

      - name: Fail if deterministic build files changed
        run: bash tools/deterministic-build/check_no_content_changes.sh

  linux-tests:
    strategy:
      matrix:
        backend: [fulcrum, cbf]
        python-version: ['3.12'] # , '3.13'
    uses: ./.github/workflows/python-tests.yml
    secrets: inherit
    with:
      os: ubuntu-22.04
      backend: ${{ matrix.backend }}
      python-version: ${{ matrix.python-version }}

  windows-tests:
    if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'pytest-win') }}
    strategy:
      matrix:
        backend: [cbf]
    uses: ./.github/workflows/python-tests.yml
    secrets: inherit
    with:
      os: windows-latest
      backend: ${{ matrix.backend }}

  macos-tests:
    if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'pytest-mac') }}
    strategy:
      matrix:
        backend: [cbf]
    uses: ./.github/workflows/python-tests.yml
    secrets: inherit
    with:
      os: macos-latest
      backend: ${{ matrix.backend }}
