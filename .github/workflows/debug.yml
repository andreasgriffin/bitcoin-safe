name: Spin up a machine
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs: 
      runner-id:
        description: 'runner-id  (e.g. mac-13 mac-14 ubuntu-22.04 )  see available: https://github.com/actions/runner-images?tab=readme-ov-file#available-images' 
        required: true
        default: 'macos-15'

jobs:
  debug:
    runs-on: '${{ github.event.inputs.runner-id }}'
    steps:
      - name: Install tmate
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install tmate
          elif [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y tmate
          else
            echo "Unsupported runner OS: $RUNNER_OS" >&2
            exit 1
          fi

      - name: Start SSH session
        run: |
          tmate -F
