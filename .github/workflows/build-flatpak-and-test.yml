name: Build Flatpak and test
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      commitHash:
        description: "Enter the commit hash to build (leave empty to use the default branch or the branch that triggered the workflow)"
        required: false
        type: string
      artifact_name_prefix:
        description: "Optional prefix for uploaded artifact names"
        required: false
        default: ""
        type: string
      run_tests:
        description: "Run the Flatpak smoke test after the build"
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      commitHash:
        required: false
        type: string
        default: ""
      artifact_name_prefix:
        required: false
        type: string
        default: ""
      run_tests:
        required: false
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch and checkout custom commit
        if: ${{ inputs.commitHash != '' }}
        run: |
          git fetch origin ${{ inputs.commitHash }}
          git checkout ${{ inputs.commitHash }}

      - name: Set up Python environment
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-xinput0 \
            libxcb-xfixes0 \
            libxcb-shape0 \
            libglib2.0-0 \
            libegl1 \
            libgl1 \
            libglu1-mesa \
            libxrender1 \
            libxi6 \
            libxkbcommon0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install

      - name: Build Flatpak bundle in Docker
        run: poetry run python tools/build.py --targets flatpak --commit None

      - name: Check for Flatpak bundle
        run: |
          if [ -z "$(find dist -type f -name '*.flatpak')" ]; then
            echo "Flatpak bundle is missing"
            exit 1
          fi

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name_prefix }}flatpak-artifacts
          path: |
            dist/*.flatpak
            tools/build_linux/flathub_flatpak/build/repro-debug/**
          if-no-files-found: error

  test:
    if: ${{ inputs.run_tests }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DISPLAY: ":99"
      QT_QPA_PLATFORM: xcb
      XDG_RUNTIME_DIR: /tmp/runtime-bitcoin-safe
      LANG: en_US.UTF-8
      LANGUAGE: en_US:en
      LC_ALL: en_US.UTF-8
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch and checkout custom commit
        if: ${{ inputs.commitHash != '' }}
        run: |
          git fetch origin ${{ inputs.commitHash }}
          git checkout ${{ inputs.commitHash }}

      - name: Download Flatpak artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artifact_name_prefix }}flatpak-artifacts
          path: artifacts

      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            imagemagick \
            xvfb \
            dbus-x11 \
            x11-apps \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-xinput0 \
            libxcb-xfixes0 \
            libxcb-shape0 \
            libglib2.0-0 \
            libegl1 \
            libgl1 \
            libglu1-mesa \
            libxrender1 \
            libxi6 \
            libxkbcommon0
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"

      - name: Start Xvfb
        run: |
          Xvfb "$DISPLAY" -screen 0 1280x720x24 &
          echo $! > xvfb.pid
          sleep 3

      - name: Create faulty host fontconfig cache (regression reproducer)
        # Reproduces the host cache written by Google Chrome 154: *cache-9/10/11
        # symlinks pointing at *cache-12 data. Flatpak exposes the host user cache
        # as /run/host/user-fonts-cache, and the runtime's fontconfig then segfaults
        # in FcCharSetHasChar. The smoke test below must pass despite this.
        run: |
          set -euo pipefail
          source tools/build_linux/flathub_flatpak/flatpak_common.sh
          install_flatpak_prerequisites
          ensure_flathub_remote
          BUNDLE_PATH=$(find artifacts -type f -name '*.flatpak' | head -n 1)
          test -n "$BUNDLE_PATH"
          run_with_dbus_session flatpak install --user --noninteractive --reinstall "$BUNDLE_PATH"
          CACHE_DIR="$HOME/.cache/fontconfig"
          rm -rf "$CACHE_DIR"
          mkdir -p "$CACHE_DIR"
          # Use the runtime's own fontconfig (version 12 cache format) to write
          # the cache, so the data really is the newer format.
          # Must live under $HOME: flatpak gives the sandbox a private /tmp, and
          # $HOME is shared with it through --filesystem=home.
          SCRATCH="$HOME/fc12-scratch"
          rm -rf "$SCRATCH"
          mkdir -p "$SCRATCH"
          run_with_dbus_session flatpak run --command=sh org.bitcoin_safe.BitcoinSafe -c \
            "XDG_CACHE_HOME='$SCRATCH' fc-cache -f"
          SOURCE=$(find "$SCRATCH" -type f -name '*-le64.cache-*' | head -n 1)
          test -n "$SOURCE" || { echo "runtime fc-cache wrote no cache file"; exit 1; }
          HASH=$(basename "$SOURCE" | sed 's/-le64.cache-.*//')
          cp "$SOURCE" "$CACHE_DIR/${HASH}-le64.cache-12"
          VERSION=$(od -An -t u4 -j 4 -N 4 "$CACHE_DIR/${HASH}-le64.cache-12" | tr -d ' ')
          echo "cache header version: ${VERSION}"
          test "${VERSION}" = "12" || { echo "expected cache version 12, got ${VERSION}"; exit 1; }
          for version in 9 10 11; do
            ln -sf "${HASH}-le64.cache-12" "$CACHE_DIR/${HASH}-le64.cache-${version}"
          done
          ls -la "$CACHE_DIR"

      - name: Prepare user namespaces for Flatpak smoke test
        run: |
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if sysctl kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi

      - name: Smoke-test Flatpak bundle
        run: |
          BUNDLE_PATH=$(find artifacts -type f -name '*.flatpak' | head -n 1)
          if [ -z "$BUNDLE_PATH" ]; then
            echo "No Flatpak bundle found for smoke test"
            exit 1
          fi
          bash tools/build_linux/flathub_flatpak/install_and_smoke_test_bundle.sh "$BUNDLE_PATH" org.bitcoin_safe.BitcoinSafe

      - name: Collect Flatpak startup logs
        if: always()
        run: |
          mkdir -p flatpak-startup-logs
          cp -a "$HOME/.var/app/org.bitcoin_safe.BitcoinSafe/config/bitcoin_safe" \
            flatpak-startup-logs/ || true

      - name: Upload Flatpak startup logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flatpak-startup-logs
          path: |
            artifacts/repro-debug/**
            tools/build_linux/flathub_flatpak/build/flatpak-run.log
            tools/build_linux/flathub_flatpak/build/flatpak-screenshot-*.xwd
            tools/build_linux/flathub_flatpak/build/flatpak-screenshot-*.png
            flatpak-startup-logs/**
          if-no-files-found: ignore
