name: Python Tests with PyQt6
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      backend:
        required: true
        type: string
      python-version:
        required: false
        type: string
        default: "3.12"
      repository:
        required: false
        type: string
        default: ""
      ref:
        required: false
        type: string
        default: ""

  workflow_dispatch:
    inputs:
      os:
        description: "Runner OS"
        required: true
        type: choice
        options:
          - ubuntu-22.04
          - windows-latest
          - macos-latest
      backend:
        description: "Backend selector passed to pytest as --<backend>"
        required: true
        type: choice
        options:
          - fulcrum
          - cbf
      python-version:
        description: "Python version"
        required: false
        type: string
        default: "3.12"
      repository:
        description: "Repository to checkout (owner/name). Leave empty for current repo."
        required: false
        type: string
        default: ""
      ref:
        description: "Git ref to checkout (branch/tag/SHA). Leave empty for event ref."
        required: false
        type: string
        default: ""
        
jobs:
  test:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 20
    env:
      DISPLAY: ":99.0"  # Display setting for Xvfb on Linux
      QT_SELECT: "qt6"  # Environment variable to select Qt6


    steps:
    - uses: actions/checkout@v7.0.1
      with:
        repository: ${{ inputs.repository != '' && inputs.repository || github.repository }}
        ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}
        fetch-depth: 0

    - name: Set English locale for Linux GUI tests
      if: runner.os == 'Linux'
      run: |
        echo "LANG=en_US.UTF-8" >> "$GITHUB_ENV"
        echo "LANGUAGE=en_US:en" >> "$GITHUB_ENV"
        echo "LC_ALL=en_US.UTF-8" >> "$GITHUB_ENV"

    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v7.1.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Setup xvfb (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb \
                               libxkbcommon-x11-0 \
                               libxcb-icccm4 \
                               libxcb-image0 \
                               libxcb-keysyms1 \
                               libxcb-randr0 \
                               libxcb-render-util0 \
                               libxcb-xinerama0 \
                               libxcb-xinput0 \
                               libxcb-xfixes0 \
                               libxcb-shape0 \
                               libglib2.0-0 \
                               libegl1 \
                               libgl1-mesa-dev \
                               '^libxcb.*-dev' \
                               libx11-xcb-dev \
                               libglu1-mesa-dev \
                               libxrender-dev \
                               libxi-dev \
                               libxkbcommon-dev \
                               libxkbcommon-x11-dev \
                               libpulse0
        sudo /usr/bin/Xvfb $DISPLAY -screen 0 1280x1024x24 &

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install poetry==2.5.1
        poetry install  

    - name: Run General Tests
      run: |
        poetry run pytest -m 'not marker_qt_1 and not marker_qt_2 and not marker_qt_3 and not integration' -vvv --log-cli-level=DEBUG --setup-show --maxfail=1 --${{ inputs.backend }}

    - name: Run Tests for marker_qt_1
      run: |
        poetry run pytest -m 'marker_qt_1 and not integration' -vvv --log-cli-level=DEBUG --setup-show --maxfail=1 --${{ inputs.backend }}

    - name: Run Tests for marker_qt_2
      run: |
        poetry run pytest -m 'marker_qt_2 and not integration' -vvv --log-cli-level=DEBUG --setup-show --maxfail=1 --${{ inputs.backend }}

    - name: Run Tests for marker_qt_3
      run: |
        poetry run pytest -m 'marker_qt_3 and not integration' -vvv --log-cli-level=DEBUG --setup-show --maxfail=1 --${{ inputs.backend }}

    - name: Upload output Files from tests/output
      if: always()  # This ensures the step runs regardless of previous failures    
      uses: actions/upload-artifact@v7
      with:
        name: pytest-output-${{ inputs.python-version }}-${{ inputs.os }}-${{ inputs.backend }}
        path: tests/output
